name: Build rootless deb

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (Theos, rootless)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid dpkg
      - name: Set up Theos
        uses: Randomblock1/theos-action@v1

      - name: Ensure iPhoneOS 16.5 SDK is present
        run: |
          set -eu
          if ls "$THEOS"/sdks/iPhoneOS16*.sdk >/dev/null 2>&1; then
            echo "SDK already present:"
            ls -d "$THEOS"/sdks/iPhoneOS16*.sdk
            exit 0
          fi
          echo "No iPhoneOS 16.x SDK found, fetching from theos/sdks"
          mkdir -p "$THEOS/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks
          cp -r /tmp/sdks/sdks-master/iPhoneOS16.5.sdk "$THEOS/sdks/"
          ls -d "$THEOS"/sdks/iPhoneOS16*.sdk

      - name: Verify signing tool
        run: command -v ldid
      - name: Verify build environment
        run: |
          chmod +x scripts/check-build-env.sh
          ./scripts/check-build-env.sh

      - name: Build package
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Inspect produced package
        run: |
          set -eu
          deb="$(ls packages/*.deb | head -n 1)"
          echo "Package: $deb"
          dpkg-deb -I "$deb"
          echo "--- contents ---"
          dpkg-deb -c "$deb"

      - name: Verify modern arm64e ABI
        run: |
          set -eu
          payload="$(mktemp -d)"
          dpkg-deb -x "$(ls packages/*.deb | head -n 1)" "$payload"
          python3 tools/check-ptrauth.py "$payload"
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccshortcutlauncher-rootless-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CCShortcutLauncher ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: packages/*.deb

  preference-store-tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test direct plist persistence
        run: |
          clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation -I. tools/test-preference-store.m PTPreferenceStore.m -o /tmp/preferences-test
          /tmp/preferences-test
